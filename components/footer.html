<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>footer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/components/footer.css">
</head>

<body>

    <!-- Professional Footer with Updated Colors -->
    <footer class="footer-section text-white py-12 px-4 sm:px-6 md:px-8">
        <div class="max-w-6xl mx-auto">

            <!-- Main Footer Content -->
            <div class="grid gap-8 grid-cols-1 md:grid-cols-3 mb-8">

                <!-- Company Info with Logo -->
                <div id="footer-block-1" class="footer-fade-in loading">
                    <!-- Skeleton Logo -->
                    <div class="skeleton-footer skeleton-logo"></div>

                    <!-- Skeleton Title -->
                    <div class="skeleton-footer skeleton-title"></div>

                    <!-- Skeleton Text -->
                    <div class="skeleton-footer skeleton-text"></div>
                    <div class="skeleton-footer skeleton-text"></div>
                    <div class="skeleton-footer skeleton-text short"></div>

                    <!-- Skeleton Established Text -->
                    <div class="skeleton-footer skeleton-text short mt-4"></div>
                </div>

                <!-- Quick Links -->
                <div id="footer-block-2" class="footer-fade-in loading">
                    <!-- Skeleton Title -->
                    <div class="skeleton-footer skeleton-title mb-4"></div>

                    <!-- Skeleton Links -->
                    <div class="skeleton-footer skeleton-link"></div>
                    <div class="skeleton-footer skeleton-link"></div>
                    <div class="skeleton-footer skeleton-link"></div>
                    <div class="skeleton-footer skeleton-link"></div>
                    <div class="skeleton-footer skeleton-link"></div>
                </div>

                <!-- Contact & Social -->
                <div id="footer-block-3" class="footer-fade-in loading">
                    <!-- Skeleton Title -->
                    <div class="skeleton-footer skeleton-title mb-4"></div>

                    <!-- Skeleton Contact Info -->
                    <div class="skeleton-footer skeleton-contact"></div>
                    <div class="skeleton-footer skeleton-contact"></div>
                    <div class="skeleton-footer skeleton-contact"></div>

                    <!-- Skeleton Buttons -->
                    <div class="skeleton-footer skeleton-button mt-6"></div>
                    <div class="skeleton-footer skeleton-button"></div>

                    <!-- Skeleton Social Icons -->
                    <div class="flex space-x-3 mt-6">
                        <div class="skeleton-footer skeleton-social"></div>
                        <div class="skeleton-footer skeleton-social"></div>
                        <div class="skeleton-footer skeleton-social"></div>
                        <div class="skeleton-footer skeleton-social"></div>
                    </div>
                </div>
            </div>

            <!-- Skeleton Divider -->
            <div class="skeleton-footer mb-6" style="height: 1px;"></div>

            <!-- Skeleton Bottom Footer -->
            <div id="footer-bottom" class="footer-fade-in loading">
                <div class="flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
                    <div class="skeleton-footer" style="width: 250px; height: 16px;"></div>
                    <div class="flex space-x-6">
                        <div class="skeleton-footer" style="width: 60px; height: 16px;"></div>
                        <div class="skeleton-footer" style="width: 60px; height: 16px;"></div>
                        <div class="skeleton-footer" style="width: 60px; height: 16px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="../assets/js/components/footer.js"></script>

</body>

</html>
