<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Moroccan Jellaba Collection - Royal Heritage</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Playfair Display and Inter -->
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/css/components/hero.css">
</head>

<body class="inter">
  <section class="hero-background">
    <!-- Decorative Pattern -->
    <div class="decorative-pattern"></div>

    <!-- Single Video Background (now for all screen sizes) -->
    <div class="video-overlay">
      <video autoplay loop muted playsinline class="w-full h-full object-cover">
        <source src="../assets/media/hero-collection.webm" type="video/mp4">
      </video>
    </div>

    <!-- Hero Content -->
    <div class="hero-content">
      <h1 class="hero-title playfair fade-in">
        Premium Moroccan
        <br>
        <span style="color: var(--cream);">Jellaba Collection</span>
      </h1>

      <p class="hero-subtitle fade-in fade-in-delay-1">
        Discover authentic Moroccan craftsmanship and royal heritage.
      </p>

      <div class="hero-features fade-in fade-in-delay-2">
        <div class="feature-item">
          <i class="fas fa-crown"></i>
          <span>Royal Heritage</span>
        </div>
        <div class="feature-item">
          <i class="fas fa-hand-sparkles"></i>
          <span>Handcrafted</span>
        </div>
        <div class="feature-item">
          <i class="fas fa-leaf"></i>
          <span>Premium Cotton</span>
        </div>
        <div class="feature-item">
          <i class="fas fa-shipping-fast"></i>
          <span>Free Shipping</span>
        </div>
      </div>

      <div class="button-container flex flex-wrap justify-center items-center gap-4 fade-in fade-in-delay-3">
        <button class="ocean-effect" onclick="exploreCollection()">
          <div class="wave-layer"></div>
          <div class="fill-layer"></div>
          <span class="button-text">
            <i class="fas fa-eye"></i>
            Explore Collection
          </span>
        </button>
      </div>
    </div>

    <!-- Scroll Indicator -->
    <div class="scroll-indicator">
      <div class="text-sm mb-2">Discover More</div>
      <i class="fas fa-chevron-down"></i>
    </div>
  </section>

  <script>
    // Button Actions
    function exploreCollection() {
      console.log('Exploring collection...');
      // Add smooth scroll to products section or redirect to catalog
      // window.location.href = '#products';
    }

    // Smooth scroll for scroll indicator
    document.querySelector('.scroll-indicator').addEventListener('click', function () {
      window.scrollBy({
        top: window.innerHeight,
        behavior: 'smooth'
      });
    });

    // Add parallax effect to decorative pattern
    window.addEventListener('scroll', function () {
      const scrolled = window.pageYOffset;
      const pattern = document.querySelector('.decorative-pattern');
      if (pattern) {
        pattern.style.transform = `translate(-50%, -50%) rotate(${scrolled * 0.1}deg)`;
      }
    });

    // Initialize animations on load
    document.addEventListener('DOMContentLoaded', function () {
      console.log('Premium Moroccan Jellaba Hero Page Loaded');
    });
  </script>
</body>

</html>
