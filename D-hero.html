<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Moroccan Jellaba Collection - Royal Heritage</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Playfair Display and Inter -->
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    /* Define CSS variables for consistent colors */
    :root {
      --primary-navy: #0f172a;
      /* Dark color for the wave effect */
      --secondary-navy: #1e293b;
      /* Slightly lighter dark color for the wave gradient */
      --accent-gold: #B8860B;
      /* User's requested gold color */
      --light-gold: #DAA520;
      /* Lighter gold color */
      --warm-gold: #CD853F;
      /* Warmer gold color */
      --cream: #f5f1e8;
      /* Cream color for text */
      --warm-white: #ffffff;
      /* Warm white color */
      --soft-gray: #f8fafc;
      /* Soft gray color */
      --text-primary: #0f172a;
      /* Primary text color */
      --text-secondary: #334155;
      /* Secondary text color */
      --gradient-gold: linear-gradient(135deg, #c9a96e 0%, #D4AF37 50%, #B8941F 100%);
      /* Gradient gold */
    }

    /* Font Families */
    .playfair {
      font-family: 'Playfair Display', serif;
    }

    .inter {
      font-family: 'Inter', sans-serif;
    }

    /* Body Setup */
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* Hero Background */
    .hero-background {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Video Backgrounds */
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .video-overlay video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 1;
    }

    /* Gradient Overlay */
    .hero-background::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0.6) 100%);
      z-index: 2;
    }

    /* Content Container */
    .hero-content {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 1200px;
      padding: 0 2rem;
    }

    /* Main Title */
    .hero-title {
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 900;
      color: var(--accent-gold);
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      margin-bottom: 1rem;
      line-height: 1.1;
      position: relative;
    }

    /* Subtitle */
    .hero-subtitle {
      font-size: clamp(1.125rem, 3vw, 1.5rem);
      color: var(--cream);
      font-weight: 600;
      margin-bottom: 2rem;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Features List */
    .hero-features {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--cream);
      font-weight: 500;
      font-size: 0.875rem;
    }

    .feature-item i {
      color: var(--accent-gold);
      font-size: 1rem;
    }

    /* Professional Ocean Effect Button */
    .ocean-effect {
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      border-radius: 0;
      font-weight: 700;
      z-index: 10;
      padding: 1rem 2.5rem;
      font-size: 1.125rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0 0.5rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      min-width: 220px;
    }

    .ocean-effect {
      background: transparent;
      border: 2px solid var(--accent-gold);
      color: var(--accent-gold);
    }

    .ocean-effect::before,
    .ocean-effect::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--primary-navy);
      transform: translateX(-100%) translateY(100%);
      transition: none;
      z-index: 1;
    }

    .ocean-effect::before {
      background: linear-gradient(45deg, var(--primary-navy) 0%, var(--secondary-navy) 50%, var(--primary-navy) 100%);
      border-radius: 50% 40% 60% 30%;
    }

    .ocean-effect::after {
      background: linear-gradient(-45deg, var(--primary-navy) 0%, var(--secondary-navy) 50%, var(--primary-navy) 100%);
      border-radius: 40% 60% 30% 50%;
    }

    .ocean-effect .wave-layer {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, var(--primary-navy) 0%, var(--secondary-navy) 50%, var(--primary-navy) 100%);
      border-radius: 60% 30% 50% 40%;
      transform: translateX(-100%) translateY(100%);
      transition: none;
      z-index: 1;
    }

    .ocean-effect .fill-layer {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--primary-navy);
      transform: scaleX(0);
      transform-origin: left;
      transition: none;
      z-index: 0;
    }

    /* Animation Keyframes */
    @keyframes oceanWave {
      0% {
        transform: translateX(-100%) translateY(100%);
      }

      50% {
        transform: translateX(-50%) translateY(-10%);
      }

      100% {
        transform: translateX(0%) translateY(0%);
      }
    }

    @keyframes oceanWave2 {
      0% {
        transform: translateX(-100%) translateY(100%) scaleY(0.8);
      }

      60% {
        transform: translateX(-30%) translateY(-5%) scaleY(1.2);
      }

      100% {
        transform: translateX(0%) translateY(0%) scaleY(1);
      }
    }

    @keyframes oceanWave3 {
      0% {
        transform: translateX(-100%) translateY(100%) scaleY(0.6);
      }

      70% {
        transform: translateX(-20%) translateY(-15%) scaleY(1.4);
      }

      100% {
        transform: translateX(0%) translateY(0%) scaleY(1);
      }
    }

    @keyframes fillSides {
      0% {
        transform: scaleX(0);
      }

      100% {
        transform: scaleX(1);
      }
    }

    /* Hover Effects */
    @media (hover: hover) and (pointer: fine) {
      .ocean-effect:hover::before {
        animation: oceanWave 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }

      .ocean-effect:hover::after {
        animation: oceanWave2 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        animation-delay: 0.1s;
      }

      .ocean-effect:hover .wave-layer {
        animation: oceanWave3 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        animation-delay: 0.2s;
      }

      .ocean-effect:hover .fill-layer {
        animation: fillSides 0.3s ease forwards;
        animation-delay: 1.2s;
      }

      .ocean-effect:hover .button-text {
        color: var(--accent-gold) !important;
        transition: color 0.5s ease 0.4s;
      }

      .ocean-effect:hover {
        border-color: var(--primary-navy);
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(184, 134, 11, 0.3);
      }
    }

    .ocean-effect>* {
      position: relative;
      z-index: 2;
    }

    /* Decorative Elements */
    .decorative-pattern {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120%;
      height: 120%;
      background-image:
        radial-gradient(circle at 25% 25%, rgba(184, 134, 11, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(205, 133, 63, 0.1) 0%, transparent 50%);
      z-index: 1;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(-50%, -50%) rotate(0deg);
      }

      50% {
        transform: translate(-50%, -50%) rotate(180deg);
      }
    }

    /* Scroll Indicator */
    .scroll-indicator {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      color: var(--cream);
      text-align: center;
      z-index: 10;
    }

    .scroll-indicator i {
      font-size: 1.5rem;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {

      0%,
      20%,
      50%,
      80%,
      100% {
        transform: translateY(0);
      }

      40% {
        transform: translateY(-10px);
      }

      60% {
        transform: translateY(-5px);
      }
    }

    /* Mobile Optimizations */
    @media (max-width: 768px) {
      .hero-content {
        padding: 0 1rem;
      }

      .hero-features {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-bottom: 2rem;
        justify-items: center;
        max-width: 400px;
        margin-left: auto;
        margin-right: auto;
      }

      .feature-item {
        font-size: 0.75rem;
        justify-self: center;
      }

      .ocean-effect {
        padding: 0.875rem 1.5rem;
        font-size: 1rem;
        margin: 0.25rem;
      }

      .button-container {
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }

      .button-container .ocean-effect {
        width: 100%;
        max-width: 300px;
        justify-content: center;
      }
    }

    @media (max-width: 640px) {
      .hero-features {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
        margin-bottom: 2rem;
        justify-items: center;
        max-width: 350px;
        margin-left: auto;
        margin-right: auto;
      }

      .feature-item {
        font-size: 0.7rem;
        justify-self: center;
      }

      .ocean-effect {
        padding: 0.75rem 1.25rem;
        font-size: 0.875rem;
      }
    }

    /* Fade in animation */
    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1s ease forwards;
    }

    .fade-in-delay-1 {
      animation-delay: 0.2s;
    }

    .fade-in-delay-2 {
      animation-delay: 0.4s;
    }

    .fade-in-delay-3 {
      animation-delay: 0.6s;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="inter">
  <section class="hero-background">
    <!-- Decorative Pattern -->
    <div class="decorative-pattern"></div>

    <!-- Single Video Background (now for all screen sizes) -->
    <div class="video-overlay">
      <video autoplay loop muted playsinline class="w-full h-full object-cover">
        <source src="kounouz-articles.webm" type="video/mp4">
      </video>
    </div>

    <!-- Hero Content -->
    <div class="hero-content">
      <h1 class="hero-title playfair fade-in">
        Premium Moroccan
        <br>
        <span style="color: var(--cream);">Jellaba Collection</span>
      </h1>

      <p class="hero-subtitle fade-in fade-in-delay-1">
        Discover authentic Moroccan craftsmanship and royal heritage.
      </p>

      <div class="hero-features fade-in fade-in-delay-2">
        <div class="feature-item">
          <i class="fas fa-crown"></i>
          <span>Royal Heritage</span>
        </div>
        <div class="feature-item">
          <i class="fas fa-hand-sparkles"></i>
          <span>Handcrafted</span>
        </div>
        <div class="feature-item">
          <i class="fas fa-leaf"></i>
          <span>Premium Cotton</span>
        </div>
        <div class="feature-item">
          <i class="fas fa-shipping-fast"></i>
          <span>Free Shipping</span>
        </div>
      </div>

      <div class="button-container flex flex-wrap justify-center items-center gap-4 fade-in fade-in-delay-3">
        <button class="ocean-effect" onclick="exploreCollection()">
          <div class="wave-layer"></div>
          <div class="fill-layer"></div>
          <span class="button-text">
            <i class="fas fa-eye"></i>
            Explore Collection
          </span>
        </button>
      </div>
    </div>

    <!-- Scroll Indicator -->
    <div class="scroll-indicator">
      <div class="text-sm mb-2">Discover More</div>
      <i class="fas fa-chevron-down"></i>
    </div>
  </section>

  <script>
    // Button Actions
    function exploreCollection() {
      console.log('Exploring collection...');
      // Add smooth scroll to products section or redirect to catalog
      // window.location.href = '#products';
    }

    // Smooth scroll for scroll indicator
    document.querySelector('.scroll-indicator').addEventListener('click', function () {
      window.scrollBy({
        top: window.innerHeight,
        behavior: 'smooth'
      });
    });

    // Add parallax effect to decorative pattern
    window.addEventListener('scroll', function () {
      const scrolled = window.pageYOffset;
      const pattern = document.querySelector('.decorative-pattern');
      if (pattern) {
        pattern.style.transform = `translate(-50%, -50%) rotate(${scrolled * 0.1}deg)`;
      }
    });

    // Initialize animations on load
    document.addEventListener('DOMContentLoaded', function () {
      console.log('Premium Moroccan Jellaba Hero Page Loaded');
    });
  </script>
</body>

</html>
