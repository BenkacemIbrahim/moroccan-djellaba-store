<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breadcrumb Section</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --accent-gold: #d4af37;
      --hover-gold: #f4d03f;
    }

    /* Skeleton loading styles */
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }

    .skeleton-breadcrumb {
      height: 20px;
      width: 100%;
      border-radius: 0;
      margin: 16px 0;
    }

    @keyframes loading {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    /* Content state management */
    .content-state {
      display: none;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    .content-state.loaded {
      display: block;
      opacity: 1;
    }

    /* Breadcrumb styles */
    .breadcrumb {
      padding: 16px 0;
    }

    .breadcrumb a {
      color: var(--accent-gold);
      transition: all 0.3s ease;
      font-weight: 600;
      font-size: 1rem;
    }

    .breadcrumb a:hover {
      color: var(--hover-gold);
      text-decoration: underline;
    }

    .breadcrumb span {
      font-size: 1rem;
      font-weight: 600;
    }

    /* Mobile responsive styles */
    @media (max-width: 768px) {
      .breadcrumb {
        padding: 10px 0;
      }

      .breadcrumb-mobile {
        display: flex;
        flex-direction: row;
        gap: 4px;
        font-size: 0.8rem;
        flex-wrap: nowrap;
        align-items: center;
        overflow-x: auto;
        white-space: nowrap;
        padding-bottom: 4px;
      }

      .breadcrumb-mobile a,
      .breadcrumb-mobile span {
        font-size: 0.8rem;
        line-height: 1.3;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .breadcrumb-mobile .mx-2 {
        display: inline;
        font-size: 0.75rem;
        flex-shrink: 0;
      }

      .breadcrumb-desktop {
        display: none;
      }

      .skeleton-breadcrumb {
        width: 100%;
        height: 16px;
      }
    }

    /* Desktop styles */
    @media (min-width: 769px) {
      .breadcrumb-mobile {
        display: none;
      }

      .breadcrumb-desktop {
        display: block;
      }
    }

    .section-spacing {
      margin-bottom: 32px;
    }
  </style>
</head>

<body class="bg-gray-50">
  <!-- Loading skeleton state -->
  <div id="loading-content" class="content-state">
    <div class="bg-gradient-to-r from-slate-50 to-gray-100 py-4 border-b-2 border-gray-200">
      <div class="max-w-7xl mx-auto px-3 sm:px-4 lg:px-6">
        <div class="skeleton skeleton-breadcrumb"></div>
      </div>
    </div>
  </div>

  <!-- Main breadcrumb content -->
  <div id="main-content" class="content-state">
    <div class="bg-gradient-to-r from-slate-50 to-gray-100 py-4 border-b-2 border-gray-200 relative overflow-hidden"
      style="background-image: url('https://hebbkx1anhila5yf.public.blob.vercel-storage.com/royal-heritage-pattern.-G8mXef6yKyhLbpdxKq24fFWAyJCxRW.png'); background-size: cover; background-position: center; background-repeat: no-repeat;">
      <div class="absolute inset-0 bg-black bg-opacity-40"></div>
      <div class="max-w-7xl mx-auto px-3 sm:px-4 lg:px-6 relative z-10">
        <nav class="breadcrumb">
          <!-- Desktop breadcrumb -->
          <div class="breadcrumb-desktop">
            <a href="#" class="hover:underline font-bold text-white hover:text-yellow-300 transition-colors">
              <i class="fas fa-home mr-2"></i>Home
            </a>
            <span class="mx-2 font-bold text-yellow-400">/</span>
            <a href="#"
              class="hover:underline font-bold text-white hover:text-yellow-300 transition-colors">Products</a>
            <span class="mx-2 font-bold text-yellow-400">/</span>
            <span class="text-yellow-300 font-bold">Premium Royal Heritage</span>
          </div>

          <!-- Mobile breadcrumb -->
          <div class="breadcrumb-mobile">
            <a href="#" class="hover:underline font-bold text-white hover:text-yellow-300 transition-colors">
              <i class="fas fa-home mr-1"></i>Home
            </a>
            <span class="mx-2 font-bold text-yellow-400">/</span>
            <a href="#"
              class="hover:underline font-bold text-white hover:text-yellow-300 transition-colors">Products</a>
            <span class="mx-2 font-bold text-yellow-400">/</span>
            <span class="text-yellow-300 font-bold">Premium Royal Heritage</span>
          </div>
        </nav>
      </div>
    </div>
  </div>
  </div>

  <script>
    // Content loading functionality
    function showContent() {
      const loadingContent = document.getElementById('loading-content');
      const mainContent = document.getElementById('main-content');

      loadingContent.classList.remove('loaded');
      mainContent.classList.add('loaded');
    }

    function showLoading() {
      const loadingContent = document.getElementById('loading-content');
      const mainContent = document.getElementById('main-content');

      mainContent.classList.remove('loaded');
      loadingContent.classList.add('loaded');
    }

    // Initialize with loading state, then show content after delay
    document.addEventListener('DOMContentLoaded', function () {
      showLoading();

      // Simulate loading time
      setTimeout(() => {
        showContent();
      }, 2000);
    });

  </script>
</body>

</html>
