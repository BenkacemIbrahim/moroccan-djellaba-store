<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJELLABTI - OTP Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Added Phosphor Icons for language dropdown -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#0f172a', light: '#1e293b', dark: '#020617' },
            accent: { DEFAULT: '#C8A95A', light: '#d4b882', dark: '#b8965a' },
            surface: { DEFAULT: '#ffffff', elevated: '#f8fafc', hover: '#f1f5f9' },
            border: { DEFAULT: '#e2e8f0', light: '#f1f5f9' },
            text: { primary: '#0f172a', secondary: '#475569', muted: '#64748b' }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            playfair: ['"Playfair Display"', 'serif']
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-in-out',
            'slide-down': 'slideDown 0.3s ease-out',
            'scale-in': 'scaleIn 0.2s ease-out'
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideDown: { '0%': { transform: 'translateY(-10px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
            scaleIn: { '0%': { transform: 'scale(0.95)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="../../../assets/css/pages/otp-verification.css">
</head>

<body>
  <!-- Added transparent header with logo and language selector -->
  <header class="transparent-header">
    <div class="header-logo">
      <img src="../assets/images/logo.png" alt="DJELLABTI Logo">
      <div class="hidden sm:block">
        <div class="logo-text">DJELLABTI</div>
        <div class="logo-subtitle">TRADITIONAL WEAR</div>
      </div>
    </div>

    <div class="language-dropdown">
      <button class="language-btn" id="languageBtn">
        <img id="currentFlag" src="https://flagcdn.com/w40/gb.png" alt="English Flag">
        <span id="currentLang">EN</span>
        <i class="ph ph-caret-down" id="languageChevron"></i>
      </button>
      <div class="language-dropdown-menu" id="languageMenu">
        <a href="#" class="language-option active" data-lang="EN" data-flag="https://flagcdn.com/w40/gb.png">
          <img src="https://flagcdn.com/w40/gb.png" alt="English Flag">
          EN
        </a>
        <a href="#" class="language-option" data-lang="FR" data-flag="https://flagcdn.com/w40/fr.png">
          <img src="https://flagcdn.com/w40/fr.png" alt="French Flag">
          FR
        </a>
        <a href="#" class="language-option" data-lang="AR" data-flag="https://flagcdn.com/w40/ma.png">
          <img src="https://flagcdn.com/w40/ma.png" alt="Arabic Flag">
          AR
        </a>
      </div>
    </div>
  </header>

  <main class="page-container">
    <div class="content-card">
      <!-- Brand Header -->
      <header class="brand-header">
        <img src="../assets/images/logo.png" alt="DJELLABTI Logo" class="brand-logo">
        <div>
          <h1 class="brand-title">DJELLABTI</h1>
          <p class="brand-subtitle">TRADITIONAL WEAR</p>
        </div>
      </header>

      <!-- Form Content -->
      <div class="form-container">
        <div class="form-header">
          <h2 class="form-title">Verify Your Email</h2>
          <p class="form-description">Please enter the 6-digit code sent to your email address.</p>
        </div>

        <form id="otpForm" method="POST" action="" novalidate>
          <!-- OTP Input Fields -->
          <div class="otp-container" role="group" aria-label="Enter 6-digit verification code">
            <input type="text" name="otp_digit_1" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric"
              autocomplete="one-time-code" required aria-label="Digit 1">
            <input type="text" name="otp_digit_2" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric"
              autocomplete="one-time-code" required aria-label="Digit 2">
            <input type="text" name="otp_digit_3" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric"
              autocomplete="one-time-code" required aria-label="Digit 3">
            <input type="text" name="otp_digit_4" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric"
              autocomplete="one-time-code" required aria-label="Digit 4">
            <input type="text" name="otp_digit_5" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric"
              autocomplete="one-time-code" required aria-label="Digit 5">
            <input type="text" name="otp_digit_6" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric"
              autocomplete="one-time-code" required aria-label="Digit 6">
          </div>

          <!-- Status Message -->
          <div id="statusMessage" class="message" role="status" aria-live="polite">
            <!-- PHP will populate error/success messages here -->
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-primary" id="verifyButton">
            Verify Code
          </button>
        </form>

        <!-- Updated resend section to display inline -->
        <section class="action-section">
          <div class="resend-inline">
            <span>Didn't receive the code?</span>
            <form method="POST" action="" style="display: inline;">
              <input type="hidden" name="action" value="resend">
              <button type="submit" class="btn-link" id="resendButton">Resend Code</button>
            </form>
          </div>
        </section>

        <!-- Updated back navigation - removed arrow icon -->
        <section class="back-action">
          <a href="" class="btn-link">
            Back to Sign In
          </a>
        </section>
      </div>
    </div>
  </main>

  <!-- Added footer with copyright and navigation links -->
  <footer class="footer">
    <div class="footer-content">
      <p class="footer-copyright">© 2025 DJELLABTI. All rights reserved.</p>
      <nav class="footer-links">
        <a href="#" class="footer-link">Privacy</a>
        <a href="#" class="footer-link">Terms</a>
        <a href="#" class="footer-link">Support</a>
        <a href="#" class="footer-link">About Us</a>
        <a href="#" class="footer-link">Contact Us</a>
      </nav>
    </div>
  </footer>

  <script>
    class OTPVerification {
      constructor() {
        this.otpInputs = document.querySelectorAll('.otp-input');
        this.init();
      }

      init() {
        this.setupOTPInputs();
        this.focusFirstInput();
      }

      setupOTPInputs() {
        this.otpInputs.forEach((input, index) => {
          // Handle input
          input.addEventListener('input', (e) => this.handleInput(e, index));

          // Handle keydown for backspace
          input.addEventListener('keydown', (e) => this.handleKeydown(e, index));

          // Handle paste for first input
          if (index === 0) {
            input.addEventListener('paste', (e) => this.handlePaste(e));
          }
        });
      }

      handleInput(event, index) {
        const input = event.target;

        // Allow only digits
        input.value = input.value.replace(/[^0-9]/g, '');

        // Move to next input if current is filled
        if (input.value.length === 1 && index < this.otpInputs.length - 1) {
          this.otpInputs[index + 1].focus();
        }
      }

      handleKeydown(event, index) {
        if (event.key === 'Backspace' && event.target.value.length === 0 && index > 0) {
          this.otpInputs[index - 1].focus();
        }
      }

      handlePaste(event) {
        const pasteData = event.clipboardData.getData('text').trim();

        if (pasteData.length === this.otpInputs.length && /^\d+$/.test(pasteData)) {
          event.preventDefault();

          pasteData.split('').forEach((char, i) => {
            if (this.otpInputs[i]) {
              this.otpInputs[i].value = char;
            }
          });

          this.otpInputs[this.otpInputs.length - 1].focus();
        }
      }

      focusFirstInput() {
        if (this.otpInputs.length > 0) {
          this.otpInputs[0].focus();
        }
      }
    }

    class LanguageDropdown {
      constructor() {
        this.languageBtn = document.getElementById('languageBtn');
        this.languageMenu = document.getElementById('languageMenu');
        this.currentFlag = document.getElementById('currentFlag');
        this.currentLang = document.getElementById('currentLang');
        this.languageChevron = document.getElementById('languageChevron');
        this.languageOptions = document.querySelectorAll('.language-option');

        this.init();
      }

      init() {
        this.languageBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          this.toggleDropdown();
        });

        this.languageOptions.forEach(option => {
          option.addEventListener('click', (e) => {
            e.preventDefault();
            this.selectLanguage(option);
          });
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', () => {
          this.closeDropdown();
        });
      }

      toggleDropdown() {
        const isOpen = this.languageMenu.classList.contains('show');
        if (isOpen) {
          this.closeDropdown();
        } else {
          this.openDropdown();
        }
      }

      openDropdown() {
        this.languageMenu.classList.add('show');
        this.languageChevron.style.transform = 'rotate(180deg)';
      }

      closeDropdown() {
        this.languageMenu.classList.remove('show');
        this.languageChevron.style.transform = 'rotate(0deg)';
      }

      selectLanguage(option) {
        const lang = option.dataset.lang;
        const flag = option.dataset.flag;

        // Update current selection
        this.currentLang.textContent = lang;
        this.currentFlag.src = flag;
        this.currentFlag.alt = `${lang} Flag`;

        // Update active state
        this.languageOptions.forEach(opt => opt.classList.remove('active'));
        option.classList.add('active');

        this.closeDropdown();
      }
    }

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
      new OTPVerification();
      new LanguageDropdown();
    });
  </script>
</body>

</html>
