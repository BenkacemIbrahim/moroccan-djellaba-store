<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJELLABTI - OTP Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Added Phosphor Icons for language dropdown -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <script src="../assets/js/pages/otp-verification.js"></script>

  <link rel="stylesheet" href="../assets/css/pages/otp-verification.css">
</head>

<body>
  <!-- Added transparent header with logo and language selector -->
  <header class="transparent-header">
    <div class="header-logo">
      <img src="../assets/images/logo.png" alt="DJELLABTI Logo">
      <div class="hidden sm:block">
        <div class="logo-text">DJELLABTI</div>
        <div class="logo-subtitle">TRADITIONAL WEAR</div>
      </div>
    </div>

    <div class="language-dropdown">
      <button class="language-btn" id="languageBtn">
        <img id="currentFlag" src="https://flagcdn.com/w40/gb.png" alt="English Flag">
        <span id="currentLang">EN</span>
        <i class="ph ph-caret-down" id="languageChevron"></i>
      </button>
      <div class="language-dropdown-menu" id="languageMenu">
        <a href="#" class="language-option active" data-lang="EN" data-flag="https://flagcdn.com/w40/gb.png">
          <img src="https://flagcdn.com/w40/gb.png" alt="English Flag">
          EN
        </a>
        <a href="#" class="language-option" data-lang="FR" data-flag="https://flagcdn.com/w40/fr.png">
          <img src="https://flagcdn.com/w40/fr.png" alt="French Flag">
          FR
        </a>
        <a href="#" class="language-option" data-lang="AR" data-flag="https://flagcdn.com/w40/ma.png">
          <img src="https://flagcdn.com/w40/ma.png" alt="Arabic Flag">
          AR
        </a>
      </div>
    </div>
  </header>

  <main class="page-container">
    <div class="content-card">
      <!-- Brand Header -->
      <header class="brand-header">
        <img src="../assets/images/logo.png" alt="DJELLABTI Logo" class="brand-logo">
        <div>
          <h1 class="brand-title">DJELLABTI</h1>
          <p class="brand-subtitle">TRADITIONAL WEAR</p>
        </div>
      </header>

      <!-- Form Content -->
      <div class="form-container">
        <div class="form-header">
          <h2 class="form-title">Verify Your Email</h2>
          <p class="form-description">Please enter the 6-digit code sent to your email address.</p>
        </div>

        <form id="otpForm" method="POST" action="" novalidate>
          <!-- OTP Input Fields -->
          <div class="otp-container" role="group" aria-label="Enter 6-digit verification code">
            <input type="text" name="otp_digit_1" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric"
              autocomplete="one-time-code" required aria-label="Digit 1">
            <input type="text" name="otp_digit_2" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric"
              autocomplete="one-time-code" required aria-label="Digit 2">
            <input type="text" name="otp_digit_3" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric"
              autocomplete="one-time-code" required aria-label="Digit 3">
            <input type="text" name="otp_digit_4" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric"
              autocomplete="one-time-code" required aria-label="Digit 4">
            <input type="text" name="otp_digit_5" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric"
              autocomplete="one-time-code" required aria-label="Digit 5">
            <input type="text" name="otp_digit_6" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric"
              autocomplete="one-time-code" required aria-label="Digit 6">
          </div>

          <!-- Status Message -->
          <div id="statusMessage" class="message" role="status" aria-live="polite">
            <!-- PHP will populate error/success messages here -->
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-primary" id="verifyButton">
            Verify Code
          </button>
        </form>

        <!-- Updated resend section to display inline -->
        <section class="action-section">
          <div class="resend-inline">
            <span>Didn't receive the code?</span>
            <form method="POST" action="" style="display: inline;">
              <input type="hidden" name="action" value="resend">
              <button type="submit" class="btn-link" id="resendButton">Resend Code</button>
            </form>
          </div>
        </section>

        <!-- Updated back navigation - removed arrow icon -->
        <section class="back-action">
          <a href="" class="btn-link">
            Back to Sign In
          </a>
        </section>
      </div>
    </div>
  </main>

  <!-- Added footer with copyright and navigation links -->
  <footer class="footer">
    <div class="footer-content">
      <p class="footer-copyright">© 2025 DJELLABTI. All rights reserved.</p>
      <nav class="footer-links">
        <a href="#" class="footer-link">Privacy</a>
        <a href="#" class="footer-link">Terms</a>
        <a href="#" class="footer-link">Support</a>
        <a href="#" class="footer-link">About Us</a>
        <a href="#" class="footer-link">Contact Us</a>
      </nav>
    </div>
  </footer>

  <script src="../assets/js/pages/otp-verification-2.js"></script>
</body>

</html>
